[project]
name = "video-ai-studio-backend"
version = "0.1.0"
description = "AI promotional short-form video studio backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
# Optional providers - install only if you want that capability
openai = ["openai>=1.50.0"]
tts = ["gTTS>=2.5.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
